<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f5ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sideGradLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="sideGradRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" />

  <!-- Subtle Circular Aura Behind Group -->
  <circle cx="200" cy="140" r="100" fill="#ffffff" fill-opacity="0.7" />

  <!-- LEFT PERSON (Companion / Vice Candidate) -->
  <g opacity="0.95">
    <circle cx="128" cy="122" r="28" fill="url(#sideGradLeft)" />
    <path d="M72 245 C72 188 102 162 128 162 C154 162 184 188 184 245 Z" fill="url(#sideGradLeft)" />
  </g>

  <!-- RIGHT PERSON (Companion) -->
  <g opacity="0.95">
    <circle cx="272" cy="122" r="28" fill="url(#sideGradRight)" />
    <path d="M216 245 C216 188 246 162 272 162 C298 162 328 188 328 245 Z" fill="url(#sideGradRight)" />
  </g>

  <!-- CENTER PERSON (Leader / Main Candidate) -->
  <g>
    <circle cx="200" cy="98" r="35" fill="url(#centerGrad)" />
    <path d="M135 245 C135 178 170 148 200 148 C230 148 265 178 265 245 Z" fill="url(#centerGrad)" />
    <!-- Formal collar highlight -->
    <path d="M190 150 L200 168 L210 150 Z" fill="#ffffff" fill-opacity="0.85" />
  </g>

  <!-- Base Soft Horizon Gradient -->
  <rect y="242" width="400" height="58" fill="#ffffff" fill-opacity="0.4" />
</svg>
